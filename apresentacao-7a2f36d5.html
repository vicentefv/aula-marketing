document.addEventListener('securitypolicyviolation',e=>{if(/firebasedatabase|firebaseio/.test(String(e.blockedURI||''))&&mode==='connecting'){clearTimeout(cto);mode='offline';refresh()}});
function connect(){
 if(mode==='online'||mode==='connecting')return;
 if(!window.firebase||!window.FB_CONFIG){mode='offline';refresh();return}
 mode='connecting';refresh();
 try{if(!db){try{firebase.database.INTERNAL.forceWebSockets()}catch(x){}const app=firebase.apps.length?firebase.app():firebase.initializeApp(FB_CONFIG);db=firebase.database(app)}else db.goOnline()}catch(e){mode='offline';refresh();return}
 clearTimeout(cto);cto=setTimeout(()=>{if(mode==='connecting'){mode='offline';try{db.goOffline()}catch(e){}refresh()}},9000);
 if(listening)return;listening=true;
 db.ref('.info/serverTimeOffset').on('value',s=>{off=s.val()||0});
 db.ref('.info/connected').on('value',s=>{if(s.val()&&mode!=='online'){clearTimeout(cto);ensureRoom().then(()=>{mode='online';refresh();if(M)follow(M.id)}).catch(()=>{mode='offline';refresh()})}else refresh()});
}
async function ensureRoom(){
 if(C&&P)return;
 let c=(LSG('deck-room')||'').toUpperCase(),ok=null;
 if(c){try{ok=(await db.ref('rooms/'+c+'/created').get()).val()}catch(e){ok=null}if(!ok||now()-ok>14*3600e3)c=null}
 if(!c)c=await newRoom();
 use(c);
}
async function newRoom(){let c,t=0,ex;do{c=Array.from({length:4},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join('');ex=(await db.ref('rooms/'+c+'/created').get()).val();t++}while(ex&&t<8);
 await db.ref('rooms/'+c).set({created:firebase.database.ServerValue.TIMESTAMP,act:{id:'lobby',key:'lobby',phase:'in'}});LSS('deck-room',c);return c}
function use(c){
 if(P){db.ref(P+'/players').off();db.ref(P+'/act').off()}
 C=c;P='rooms/'+c;curKey=null;
 db.ref(P+'/players').on('value',s=>{players=cleanP(s.val()||{});refresh()});
 db.ref(P+'/act').on('value',s=>{act=s.val()||{id:'lobby',key:'lobby',phase:'in'};subs();refresh()});
}
function subs(){if(act.key===curKey)return;curKey=act.key;ans={};vt={};if(unA)unA();if(unV)unV();
 const ra=db.ref(P+'/ans/'+curKey),rv=db.ref(P+'/vt/'+curKey);
 const fa=s=>{ans=cleanA(s.val()||{});refresh();if((ACT[act.id]||{}).pool)savePool()},fv=s=>{vt=s.val()||{};refresh()};
 ra.on('value',fa);rv.on('value',fv);unA=()=>ra.off('value',fa);unV=()=>rv.off('value',fv)}
let poolT=null;
function savePool(){clearTimeout(poolT);poolT=setTimeout(()=>{const w={};Object.keys(ans).forEach(k=>{if(players[k])Object.assign(w,Object.fromEntries(Object.entries((ans[k]||{}).w||{}).map(([i,x])=>[k+i,x])))});const L=poolFrom(w);window.POOL=L;db.ref(P+'/pool').set(L.length?L:null)},800)}
function cleanP(v){const o={};let n=0;for(const k in v){n++;const p=Object.assign({},v[k]);if(isBad(p.name))p.name='Equipa '+n;o[k]=p}return o}
function cleanA(v){const o={};for(const k in v){const a=Object.assign({},v[k]);if(a.f&&Object.values(a.f).some(x=>isBad(x)))continue;if(a.w){const w={};for(const x in a.w)if(!isBad(a.w[x]))w[x]=a.w[x];a.w=w}o[k]=a}return o}
const setAct=o=>db.ref(P+'/act').set(o);
const patch=o=>setAct(Object.assign({},act,o));
const plist=()=>Object.keys(players).map(k=>Object.assign({id:k},players[k])).sort((a,b)=>(a.at||0)-(b.at||0));
const tot=p=>Object.values((p&&p.pts)||{}).reduce((a,b)=>a+(+b||0),0);
const submitted=()=>Object.keys(ans).filter(k=>players[k]);
function award(map){const u={};for(const pid in map)u[pid+'/pts/'+act.key]=map[pid];return db.ref(P+'/players').update(u)}
const TS=()=>firebase.database.ServerValue.TIMESTAMP;
function start(id){const d=ACT[id]||{},run=uid().slice(0,4);const A={id,run,phase:'in',t0:TS(),key:id==='lobby'?'lobby':id+run};
 if(d.lim)A.lim=d.lim;if(d.type==='quiz'){A.idx=0;A.phase='q';A.key=id+run+'_0'}
 return setAct(A)}
function follow(id){if(online()&&act.id!==id)start(id)}

/* ---------- peças de interface ---------- */
const qrSVG=(txt,cell)=>{try{const q=qrcode(0,'M');q.addData(txt);q.make();return q.createSvgTag({cellSize:cell||6,margin:0,scalable:true})}catch(e){return ''}};
const joinURL=()=>BASE+'jogar.html?c='+C;
const dot=c=>`<i style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${c};flex:none"></i>`;
const chips=ch=>ch?ch.map(x=>`<span class="lv-ck ${x[1]?'ok':''}">${x[1]?'✓ ':''}${x[0]}</span>`).join(''):'';
const bar=(pct,hl)=>`<div class="lv-bar0"><i style="width:${pct}%;${hl?'background:var(--g3)':''}"></i></div>`;
const cnt=(lab,v)=>`<div class="lv-cnt"><span>${lab}</span><b>${v}</b></div>`;
const tip=t=>`<div class="lv-tip">${t}</div>`;
function ranking(n){const a=plist().map(p=>[p,tot(p)]).sort((x,y)=>y[1]-x[1]).slice(0,n||8);const mx=Math.max(1,...a.map(x=>x[1]));
 if(!a.length)return '<p class="lead">Ainda ninguém entrou na sala.</p>';
 return '<div class="lv-rank">'+a.map((x,i)=>`<div class="lv-rrow"><span class="lv-rk">${i+1}</span><div class="lv-rbar"><i style="width:${Math.round(x[1]/mx*100)}%;background:${x[0].color}"></i><b>${H(x[0].name)}</b></div><span class="lv-pt">${x[1]}</span></div>`).join('')+'</div>'}
const D=()=>ACT[M.id]||{};
const off_=id=>OFF[id]||(OFF[id]={});

/* ---------- vistas por tipo: cada uma tem modo ao vivo (telemóveis) e modo apresentador ---------- */
const V={};
V.lobby={
 body(){
  if(online())return `<div class="lv-lobby"><div class="lv-qrbig">${qrSVG(joinURL(),8)}</div><div style="display:flex;flex-direction:column;gap:22px;min-width:0">
   <div class="k">Lê o QR ou abre</div><div style="font:700 40px 'DM Sans'">${SHORT}</div>
   <div class="k" style="margin-top:14px">e escreve o código</div><div class="lv-code">${C}</div>
   <div class="k" style="margin-top:10px;color:var(--mut)">${plist().length} na sala</div><div class="lv-pl">${plist().slice(-40).map(p=>`<span class="lv-chip">${dot(p.color)}${H(p.name)}</span>`).join('')}</div></div></div>`;
  if(mode==='connecting'||mode==='idle')return `<div class="lv-msg"><div class="lv-spin"></div><div class="t3">A ligar à sala dos telemóveis…</div></div>`;
  return offMsg()},
 ctl(){return online()?[{t:'Nova sala',f:async()=>{LSS('deck-room',null);const c=await newRoom();use(c);refresh()}}]:mode==='offline'?offCtl():[]}
};
function offMsg(){return `<div class="lv-msg"><div class="t3">${IN_CLAUDE?'Dentro do Claude, a apresentação não pode ligar-se aos telemóveis.':'Esta página não conseguiu ligar-se à sala dos telemóveis.'}</div>
 <p class="lead" style="max-width:1300px">${IN_CLAUDE?'Para usar os telemóveis, abre a apresentação no endereço abaixo, no Chrome. Aqui, as atividades funcionam em modo apresentador: a turma responde em voz alta e tu registas.':'Confirma a ligação à internet e tenta outra vez. Enquanto isso, as atividades funcionam em modo apresentador.'}</p>
 ${IN_CLAUDE?`<div class="lv-url">${DECK_URL.replace('https://','')}</div>`:''}</div>`}
function offCtl(){return IN_CLAUDE?[{t:'Abrir a apresentação com telemóveis',href:DECK_URL,p:1}]:[{t:'Tentar ligar outra vez',f:()=>{mode='idle';connect()},p:1}]}

/* nuvem de palavras */
V.cloud={
 body(){let w={},who=0;
  if(online()){Object.keys(ans).forEach(k=>{if(!players[k])return;who++;Object.values((ans[k]||{}).w||{}).forEach(x=>{x=String(x).trim();const key=x.toLowerCase();if(key){w[key]=w[key]||{t:x,n:0};w[key].n++}})})}
  else w=off_(M.id).w||(off_(M.id).w={});
  const ks=Object.keys(w),cols=CONTENT.cores;
  return `${online()?cnt('Participantes',who):`<div class="lv-in"><input class="lv-inp" id="lvw" maxlength="30" placeholder="Escreve o que disserem e carrega em Enter"></div>`}
   <div class="lv-cloud">${ks.length?ks.map((k,i)=>`<span style="font-size:${Math.min(120,36+w[k].n*18)}px;color:${cols[(i+3)%cols.length]}">${H(w[k].t)}</span>`).join(''):`<span class="mut" style="font-size:40px">${online()?'As respostas aparecem aqui.':'Ainda sem respostas.'}</span>`}</div>`},
 wire(b){const i=b.querySelector('#lvw');if(!i)return;i.onkeydown=e=>{if(e.key==='Enter'){const v=i.value.trim();i.value='';if(!v||isBad(v))return;const W=off_(M.id).w||(off_(M.id).w={});const k=v.toLowerCase();W[k]=W[k]||{t:v,n:0};W[k].n++;if(D().pool){const all={};let j=0;Object.values(W).forEach(x=>{for(let r=0;r<x.n;r++)all[j++]=x.t});window.POOL=poolFrom(all)}draw()}}},
 ctl(){return online()?[{t:'Recomeçar',f:()=>start(M.id)}]:[{t:'Limpar',f:()=>{off_(M.id).w={};draw()}}]}
};

/* arrastar para grupos */
V.sort={
 body(){const d=D(),IT=d.items,B=Object.fromEntries(d.buckets.map(b=>[b.k,b]));
  const tag=b=>`<span class="lv-tag" style="background:${b.c}">${H(b.t)}</span>`;
  if(online()){const ps=plist(),n=IT.length;
   if(act.phase==='rev')return `<div class="lv-items">${IT.map((c,i)=>{const ok=ps.filter(p=>((ans[p.id]||{}).m||{})[i]===c.b).length;return `<div class="lv-it"><span>${H(c.t)}</span><span style="display:flex;gap:18px;align-items:center"><span class="mut">${ok}/${ps.length}</span>${tag(B[c.b])}</span></div>`}).join('')}</div>`;
   let dn=0;const pg=ps.map(p=>{const m=Object.keys((ans[p.id]||{}).m||{}).length;if(m>=n)dn++;return `<span class="lv-chip${m>=n?' done':''}">${dot(p.color)}${H(p.name)} · ${m}/${n}</span>`}).join('');
   return `${cnt('Terminaram',dn+' / '+ps.length)}<div class="lv-bk" style="grid-template-columns:repeat(${d.buckets.length},1fr)">${d.buckets.map(b=>`<div style="background:${b.c}">${H(b.t)}</div>`).join('')}</div><div class="lv-pl">${pg}</div>`}
  const o=off_(M.id);o.m=o.m||{};
  return `${tip('Clica num cartão para o pôr num grupo (cada clique muda). A turma decide, tu clicas. Depois revela.')}<div class="lv-items">${IT.map((c,i)=>{const k=o.m[i],b=k&&B[k];const st=o.rev?(k===c.b?' ok':' no'):'';return `<div class="lv-it lv-click${st}" data-i="${i}"><span>${H(c.t)}</span><span style="display:flex;gap:12px;align-items:center">${b?tag(b):'<span class="mut">por decidir</span>'}${o.rev&&k!==c.b?`<span class="mut">certo:</span>${tag(B[c.b])}`:''}</span></div>`}).join('')}</div>`},
 wire(b){if(online())return;b.querySelectorAll('.lv-click').forEach(el=>el.onclick=()=>{const o=off_(M.id),i=+el.dataset.i,ks=[undefined].concat(D().buckets.map(x=>x.k));o.m[i]=ks[(ks.indexOf(o.m[i])+1)%ks.length];o.rev=false;draw()})},
 ctl(){const id=M.id;if(online()){if(act.phase==='rev')return [{t:'Recomeçar',f:()=>start(id)}];return [{t:'Revelar',p:1,f:()=>{const IT=ACT[id].items,m={};plist().forEach(p=>{const a=(ans[p.id]||{}).m||{};m[p.id]=IT.reduce((s,c,i)=>s+(a[i]===c.b?20:0),0)});award(m).then(()=>patch({phase:'rev'}))}}]}
  return [{t:'Revelar',p:1,f:()=>{off_(id).rev=true;draw()}},{t:'Limpar',f:()=>{OFF[id]={};draw()}}]}
};

/* escrever (com votação opcional) */
function votesCount(){const c={};Object.values(vt).forEach(x=>{c[x]=(c[x]||0)+1});return c}
V.form={
 body(){const d=D(),id=M.id,wide=d.fields.length>5;
  const grid=`grid-template-columns:repeat(${wide?2:3},1fr)`;
  if(online()){const ph=act.phase,c=votesCount();let a=submitted().map(k=>({p:players[k],id:k,f:ans[k].f||{},A:ans[k].a}));
   if(ph==='rev'&&d.vote)a.sort((x,y)=>(c[y.id]||0)-(c[x.id]||0));const mx=Math.max(1,...Object.values(c));
   const head=(ph==='in'||!d.vote)?cnt(d.group?'Grupos que enviaram':'Enviados',a.length+' / '+plist().length):cnt('Votos',Object.keys(vt).length+' / '+plist().length);
   return `${head}<div class="lv-tiles${wide?' wide':''}" style="${grid}">${a.map((x,i)=>`<div class="card lv-tile${ph==='rev'&&d.vote&&i===0&&(c[x.id]||0)>0?' win':''}"><div class="lv-nm">${dot(x.p.color)}${H(x.p.name)}${ph!=='in'&&d.vote?`<b style="margin-left:auto;font-family:Syne;color:var(--acc)">${c[x.id]||0} voto${(c[x.id]||0)===1?'':'s'}</b>`:''}</div><div class="lv-tx">${formText(id,x.f,x.A)}</div>${d.check?`<div class="lv-cks">${chips(formChecks(id,x.f))}</div>`:''}${ph!=='in'&&d.vote?bar(Math.round((c[x.id]||0)/mx*100)):''}</div>`).join('')||`<p class="lead mut">${d.group?'As respostas dos grupos':'As respostas'} aparecem aqui quando enviarem.</p>`}</div>`}
  const o=off_(id);o.list=o.list||[];o.draft=o.draft||{};if(d.assign&&!o.A){const L=assignList(d.assign);o.A=L[Math.floor(Math.random()*L.length)]}
  const a=o.win?[...o.list].sort((x,y)=>y.v-x.v):o.list;
  return `${d.assign?`<div class="lv-asg"><span class="k">${d.assign==='produtos'?'Produto':'Marca'}</span><b>${H(o.A)}</b><button class="lv-b" id="lvre">Sortear outra</button></div>`:''}
   <div class="lv-form${d.fields.length>4?' many':''}">${d.fields.map(f=>`<label><span>${H(f.l)}</span><input class="lv-inp" data-k="${f.k}" maxlength="200" placeholder="${H(f.ph?'Ex.: '+f.ph:'')}" value="${H(o.draft[f.k]||'')}"></label>`).join('')}</div>
   ${d.check?`<div class="lv-cks" id="lvck" style="margin-top:12px">${chips(formChecks(id,o.draft))}</div>`:''}
   <div class="lv-tiles${wide?' wide':''}" style="${grid};margin-top:18px">${a.map(x=>`<div class="card lv-tile lv-click${o.win&&x===a[0]?' win':''}" data-k="${o.list.indexOf(x)}">${d.vote?`<div class="lv-nm">${x.v} voto${x.v===1?'':'s'}</div>`:''}<div class="lv-tx">${formText(id,x.f,x.A)}</div>${d.check?`<div class="lv-cks">${chips(formChecks(id,x.f))}</div>`:''}</div>`).join('')}</div>`},
 wire(b){if(online())return;const id=M.id,o=off_(id),d=ACT[id];
  b.querySelectorAll('[data-k].lv-inp').forEach(el=>el.oninput=()=>{o.draft[el.dataset.k]=el.value;const ck=b.querySelector('#lvck');if(ck)ck.innerHTML=chips(formChecks(id,o.draft))});
  const re=b.querySelector('#lvre');if(re)re.onclick=e=>{e.stopPropagation();const L=assignList(d.assign);let n;do{n=L[Math.floor(Math.random()*L.length)]}while(n===o.A&&L.length>1);o.A=n;draw()};
  if(d.vote)b.querySelectorAll('.lv-tile.lv-click').forEach(el=>el.onclick=()=>{const x=o.list[+el.dataset.k];if(x){x.v++;draw()}})},
 ctl(){const id=M.id,d=ACT[id];
  if(online()){const ph=act.phase;
   const scoreChecks=m=>{if(!d.check)return;submitted().forEach(k=>{const c=formChecks(id,ans[k].f)||[];m[k]=(m[k]||0)+c.filter(x=>x[1]).length*20})};
   if(ph==='in')return d.vote?[{t:'Abrir votação',p:1,f:()=>patch({phase:'vote'})}]:[{t:'Fechar e mostrar',p:1,f:()=>{const m={};submitted().forEach(k=>m[k]=50);scoreChecks(m);award(m).then(()=>patch({phase:'rev'}))}}];
   if(ph==='vote')return [{t:'Revelar vencedor',p:1,f:()=>{const c=votesCount(),m={};plist().forEach(p=>m[p.id]=(c[p.id]||0)*100);scoreChecks(m);award(m).then(()=>patch({phase:'rev'}))}}];
   return [{t:'Recomeçar',f:()=>start(id)}]}
  const o=off_(id);
  const cs=[{t:'Guardar resposta',p:1,f:()=>{const f={};Object.keys(o.draft||{}).forEach(k=>{const v=String(o.draft[k]||'').trim();if(v)f[k]=v});if(!Object.keys(f).length||Object.values(f).some(isBad))return;o.list.unshift({f,A:o.A,v:0});o.draft={};o.win=false;draw()}}];
  if(d.vote&&o.list&&o.list.length>1)cs.push({t:'Mostrar vencedor',f:()=>{o.win=true;draw()}});
  cs.push({t:'Limpar',f:()=>{OFF[id]={};draw()}});return cs}
};

/* ordenar a história */
V.order={
 body(){
  if(online()){const ps=plist();
   if(act.phase==='rev'){const a=ps.map(p=>{const o=(ans[p.id]&&ans[p.id].o)?ans[p.id].o.split(',').map(Number):[];return[p,SPINE.reduce((s,_,i)=>s+(o[i]===i?1:0),0)]}).sort((x,y)=>y[1]-x[1]).slice(0,8);
    return `<div style="display:flex;gap:40px"><div class="lv-story" style="flex:1.6">${SPINE.map((s,i)=>`<div class="lv-sl"><b>${i+1}</b><span>${H(s)}</span></div>`).join('')}</div><div style="flex:1"><div class="k" style="margin-bottom:16px">Posições certas</div>${a.map(x=>`<div class="lv-it" style="margin-bottom:10px"><span>${dot(x[0].color)} ${H(x[0].name)}</span><b style="font-family:Syne">${x[1]} / ${SPINE.length}</b></div>`).join('')}</div></div>`}
   let d=0;const pg=ps.map(p=>{const s=!!(ans[p.id]&&ans[p.id].o);if(s)d++;return `<span class="lv-chip${s?' done':''}">${dot(p.color)}${H(p.name)}${s?' · enviou':''}</span>`}).join('');
   return `${cnt('Enviaram',d+' / '+ps.length)}<p class="lead">Ordenem as 8 frases no telemóvel, arrastando.</p><div class="lv-pl">${pg}</div>`}
  const o=off_(M.id);if(!o.order)Object.assign(o,{order:shuf(SPINE.map((_,i)=>i)),sel:null,rev:false});
  return `${tip('Clica numa frase e depois noutra para trocar de lugar. A turma diz a ordem, tu trocas.')}<div class="lv-story">${o.order.map((k,pos)=>`<div class="lv-sl lv-click${o.sel===pos?' sel':''}${o.rev?(k===pos?' ok':' no'):''}" data-p="${pos}"><b>${o.rev?k+1:pos+1}</b><span>${H(SPINE[k])}</span></div>`).join('')}</div>`},
 wire(b){if(online())return;b.querySelectorAll('.lv-sl').forEach(el=>el.onclick=()=>{const o=off_(M.id),p=+el.dataset.p;o.rev=false;if(o.sel==null){o.sel=p}else{const t=o.order[o.sel];o.order[o.sel]=o.order[p];o.order[p]=t;o.sel=null}draw()})},
 ctl(){const id=M.id;if(online())return act.phase==='rev'?[{t:'Recomeçar',f:()=>start(id)}]:[{t:'Revelar',p:1,f:()=>{const m={};plist().forEach(p=>{const o=(ans[p.id]&&ans[p.id].o)?ans[p.id].o.split(',').map(Number):[];m[p.id]=SPINE.reduce((s,_,i)=>s+(o[i]===i?40:0),0)});award(m).then(()=>patch({phase:'rev'}))}}];
  return [{t:'Revelar',p:1,f:()=>{const o=off_(id);o.rev=true;o.sel=null;draw()}},{t:'Baralhar',f:()=>{OFF[id]={};draw()}}]}
};

/* perguntas com tempo */
V.quiz={
 body(){const id=M.id,QS=QSETS[id]||[];
  if(online()){
   if(act.phase==='end')return `<div class="k" style="margin-bottom:20px">Ranking</div>${ranking(8)}`;
   const Q=QS[act.idx],rv=act.phase==='rev',k=Q.o.map(()=>0);let n=0;Object.keys(ans).forEach(p=>{if(players[p]&&ans[p].c!=null){k[ans[p].c]++;n++}});
   return `<div class="lv-qh"><span class="k">${act.idx+1} de ${QS.length}</span>${cnt('Respostas',n+' / '+plist().length)}</div>${rv?'':'<div class="lv-tbar"><i id="lvtb"></i></div>'}
    <div class="lv-qq">${H(Q.q)}</div><div class="lv-qo n${Q.o.length}">${Q.o.map((o,i)=>`<div class="lv-o c${i}${rv?(i===Q.a?' right':' dim'):''}"><span>${H(o)}</span>${rv?`<b>${k[i]}</b>`:''}</div>`).join('')}</div>${rv?`<div class="lv-why">${H(Q.why)}</div>`:''}`}
  const o=off_(id);o.idx=o.idx||0;const Q=QS[o.idx];
  return `<div class="lv-qh"><span class="k">${o.idx+1} de ${QS.length}</span></div><div class="lv-qq">${H(Q.q)}</div><div class="lv-qo n${Q.o.length}">${Q.o.map((x,i)=>`<div class="lv-o c${i}${o.rev?(i===Q.a?' right':' dim'):''}"><span>${H(x)}</span></div>`).join('')}</div>${o.rev?`<div class="lv-why">${H(Q.why)}</div>`:''}`},

};

const N2={
 'cover':'Abertura (0:00–0:10). Dá as boas-vindas e apresenta a promessa da aula: na primeira parte vamos perceber como funciona a comunicação digital de uma marca (público, objetivos, canais, métricas); na segunda, como transformar essa estratégia em histórias. No fim, cada equipa apresenta uma mini-campanha com história. Avisa que há 3 atividades e um workshop.',
 'agenda':'Mostra o mapa em 1–2 minutos. Duas partes equilibradas: 60 minutos de comunicação digital e marketing, 60 de storytelling, e um workshop de 30 minutos que junta as duas. Os grupos formados no Bloco 1 mantêm-se até ao workshop.',
 'objetivos':'Lê os quatro objetivos. Os três primeiros são da Parte 1 (marketing digital), o quarto da Parte 2 (storytelling). Pergunta rápida à turma: qual destes vos parece mais difícil hoje? Volta a esta resposta no fecho.',
 'statement-mkt':'Slide de tese, 1 minuto. A estratégia diz a quem falamos, para quê e onde; a história faz com que alguém pare para ouvir. Uma sem a outra falha: conteúdo bem contado mas para o público errado, ou plano perfeito que ninguém lembra.',
 'd1':'Início do Bloco 1 (0:10). 30 minutos: o que mudou com o digital (4), marcas que falam contigo (4), números de Portugal (2), meios próprios, pagos e ganhos (5), jornada do cliente (5), persona (3) e atividade 01 (7).',
 'monologo':'Revela uma linha de cada vez. Pergunta: que marcas conhecem que falam “com” e não “para”? O slide seguinte traz três exemplos que a turma reconhece. A frase final resume o bloco.',
 'dados':'Números do DataReportal, “Digital 2026: Portugal” (início de 2026). Mais de 9 em cada 10 pessoas estão online e há mais ligações móveis do que habitantes (muitas pessoas têm mais do que um cartão). Atenção: “identidades em redes sociais” não é o mesmo que pessoas únicas. Confirma os valores no relatório original antes de os usares numa avaliação. Pergunta final à turma: quantas horas de ecrã tiveram ontem e em que apps (TikTok, Instagram, YouTube, Twitch, Spotify)? Pede para levantarem a mão por app. É onde a atenção deles está, e é onde as marcas competem.',
 'poem':'Revela os três meios um a um e vai desenhando o diagrama. Exemplo com a loja vintage: publica no seu Instagram (próprio), paga a um creator para mostrar uma peça (pago) e alguém faz um vídeo “o meu achado na Segunda Mão” sem ninguém pedir (ganho). Outro exemplo que conhecem: o Spotify Wrapped é um produto próprio, mas o que o torna enorme são as pessoas a partilharem nos stories (ganho). Pergunta em que meio as marcas costumam investir menos.',
 'jornada':'Uma etapa de cada vez. Para cada uma, pergunta: do que é que a pessoa precisa aqui? Pede à turma que pense na última compra importante (ténis, telemóvel, bilhete de festival) e em onde descobriram, onde compararam e o que os convenceu. Sublinha que não há um conteúdo para tudo: um TikTok funciona para descoberta, mas quem já está a decidir quer reviews e informação clara. Este modelo volta no slide das métricas.',
 'persona':'Exemplo fictício: a Rita, estudante de Design. Explica que a persona deve vir de dados reais (conversas com clientes, inquéritos, comentários, métricas) e não de suposições. Mostra como cada campo muda a comunicação: se decide quando vê alguém parecido com ela a usar a peça, o conteúdo certo são creators e clientes reais, não fotos de catálogo. Nota importante: dois jovens de 20 anos podem não ter nada em comum; o que define a persona é o problema e o contexto, não só a idade.',
 'act-persona':'Atividade 01 (8 min). Forma já os grupos de 3–4 pessoas, que se mantêm até ao workshop. 1 min de instruções, 5 min de trabalho, 2 min de partilha com 2 grupos. Se um grupo ficar preso, pede-lhe que pense numa pessoa real que conhecem e que compra aquela marca.',
 'd2':'Início do Bloco 2 (0:40). 30 minutos: objetivos SMART (5), canais (6), plano de conteúdos (5), métricas (4) e atividade 02 (10).',
 'smart':'Explica as cinco letras e depois mostra a transformação do objetivo vago no objetivo SMART (exemplo fictício da loja vintage). Pergunta: como saberíamos se “mais seguidores” foi atingido? Sem número nem prazo, não há forma de avaliar. Liga a algo que conhecem: um creator que diz “quero crescer no TikTok” é vago; “chegar aos 10 mil em 3 meses” já se pode medir.',
 'campanhas-reais':'Share a Coke: campanha australiana de 2011 com 150 dos nomes mais comuns nas garrafas; consumo entre jovens adultos +7% e tráfego no Facebook +870% (Packaging News). Pergunta: qual foi o canal próprio, qual foi o ganho? Embalagem e loja são próprios, as partilhas dos clientes são ganhas. Red Bull Stratos: 14 de outubro de 2012, mais de 8 milhões de espectadores em simultâneo no YouTube, recorde na altura (Tubefilter, Guinness). A marca virou editora de conteúdo. Barbie: 2023, orçamento de marketing de cerca de 150 milhões de dólares segundo a Variety e mais de 100 parcerias; o Barbenheimer nasceu dos fãs, não da marca (The Current). Fecha com a pergunta: o que é que a marca pediu às pessoas que fizessem?',
 'canais-mkt':'Cada canal tem um papel diferente na jornada e um tipo de meio. Insiste que uma marca pequena não precisa de estar em todos: dois canais bem escolhidos e consistentes valem mais do que seis abandonados. Liga com a persona: onde está a Rita? Pergunta: se tivessem de escolher só dois canais para a loja vintage, quais?',
 'calendario':'Exemplo fictício da loja vintage “Segunda Mão” que volta na Parte 2. Os pilares garantem variedade: não se pode só vender, nem só entreter. Mostra que cada conteúdo da semana tem um pilar e um formato. Pergunta: que pilar falta mais nos perfis que seguem?',
 'kpis':'Liga cada etapa da jornada ao que se mede. Os KPI são exemplos. Revela no fim a métrica de vaidade: um vídeo pode ter 1 milhão de views e não vender nada. Os gostos e as views não são maus, mas sozinhos não dizem se o objetivo está mais perto. Um conteúdo, um objetivo, um sinal.',
 'act-plano':'Atividade 02 (10 min), nos mesmos grupos. 1 min de instruções, 7 de trabalho, 2 de partilha. O plano cabe numa folha com quatro caixas. Avisa que este plano é a base do workshop: vão transformá-lo numa história.',
 'pausa':'Pausa (1:10–1:25). Deixa este slide projetado com o cronómetro. O desafio liga as duas partes: pensar num TikTok, anúncio ou vídeo de que se lembram e em quem era o herói.',
 'd3':'Início da Parte 2 (1:25). 40 minutos de storytelling: porque funciona (8), do facto à história e ingredientes (8), caso Spotify Wrapped (4), herói e guia (4), Story Spine e exemplo (6), atividade 03 (10). Recolhe 2 respostas ao desafio da pausa.',
 'statement':'Slide de impacto, 1 minuto. Deixa a frase respirar. Pergunta: qual foi o último anúncio ou vídeo de que se lembram? Quase de certeza é uma cena, uma pessoa, uma situação, e não uma lista de características.',
 'facto-historia':'Mostra primeiro só o cartão da esquerda e pergunta: alguém se lembraria disto amanhã? Depois revela o da direita. O facto é o mesmo (autonomia da bateria), mas agora tem uma pessoa, uma situação e uma transformação. Exemplo inventado para a aula. Se quiseres, pede à turma um segundo facto do dia a dia (o preço do bilhete de comboio, o horário da biblioteca) e transformem-no em 3 frases.',
 'ingredientes':'Slide-chave da Parte 2. Revela um ingrediente de cada vez. Liga à persona da Parte 1: a persona é a personagem; a frustração dela é o conflito; o objetivo alcançado é a transformação. Transformação não é “final feliz”, é a diferença entre o antes e o depois. Aplica a uma série que viram: quem é a personagem, qual o conflito, o que mudou entre o primeiro e o último episódio?',
 'act-spine':'Atividade 03 (10 min), nos grupos. Usam a marca e a persona das atividades anteriores, para que a Story Spine já sirva o workshop. 5 min de escrita, 3 de troca entre grupos (o outro grupo sublinha a rutura e o fim), 2 de partilha.',
 'd4':'Início do Bloco 4 (2:05). 20 minutos: panorama dos canais (5), vídeo curto (5), carrossel (5), ética (5). Liga com o Bloco 2: o canal já foi escolhido pela estratégia; agora adapta-se a história à gramática dele.',
 'canais':'Mapa rápido dos cinco canais que vamos explorar nos próximos slides. Pede à turma que diga em que canal consome mais histórias (TikTok, Stories, YouTube) e em que canal tem mais dificuldade em contá-las. As respostas ajudam-te a decidir onde te demoras. Os slides seguintes entram em detalhe: TikTok/Reels e carrossel.',
 'd5':'Início do workshop (2:25). Os grupos já existem desde a atividade 01. Cada grupo precisa de papel e canetas ou de um documento partilhado, e de um telemóvel para o cronómetro.',
 'wk-regras':'Explica o fluxo em 1 minuto. 5 min de brief, 12 de criação, 3 de ensaio e 10 de palco. Os papéis ajudam a repartir o trabalho; em grupos de 3, o estratega e o guionista juntam-se.',
 'wk-dados':'Os grupos podem manter a marca e a persona das atividades 01 e 02 e lançar só o conflito e o canal, ou lançar tudo para um desafio novo. Cada grupo só pode passar uma coluna. Marcas e personagens fictícias. Duração: 5 minutos.',
 'wk-entregaveis':'Deixa este slide projetado durante a criação (12 min), com o cronómetro. Os quatro entregáveis juntam as duas partes da aula: persona e objetivo (Parte 1), Story Spine e gancho (Parte 2), canal e KPI (as duas). Aos 9 minutos, avisa que faltam 3.',
 'wk-criterios':'Mostra os critérios antes do pitch. Os dois primeiros avaliam a estratégia, os outros a história e o canal. Cada grupo não vota em si próprio. Podes usar os botões para registar a média de cada grupo em direto.',
 'wk-palco':'Pitches (10 min): até 5 grupos × 2 minutos, com o cronómetro. Primeiro a estratégia, depois a história. 15–20 segundos de feedback com as três frases. Duplo clique no cronómetro para o repor entre grupos.',
 'takeaways':'Fecho (2:55). Revela as cinco ideias: as três primeiras vêm da Parte 1, as duas últimas juntam as duas partes. Volta à pergunta da abertura: o objetivo que parecia mais difícil ficou mais claro?',
 'checklist':'Slide para fotografar. As duas primeiras perguntas são de estratégia, as restantes de história e canal. Se alguma ficar sem resposta, o conteúdo ainda não está pronto.',
 'fontes':'Os números de Portugal vêm do DataReportal (Digital 2026: Portugal). Os números do Spotify Wrapped 2025 vêm do Music Business Worldwide; o caso do Duolingo vem do TechCrunch e o do Wendy’s da Mediashower; o Whopper Detour vem do Restaurant Dive e da Adweek. Confirma-os nas fontes originais antes de os usares numa avaliação. A origem da Story Spine é habitualmente atribuída a Kenn Adams; confirma antes de a citar formalmente. Marketing 5.0 é uma boa leitura de base para a Parte 1.',
 'marcas-conversa':'Dois exemplos de marcas que falam como pessoas e que o público jovem segue. Duolingo: a mascote Duo, a coruja verde, é a cara da marca no TikTok, com memes e piadas sobre quem falta às lições (mais de 18 milhões de seguidores, segundo a CreatorDB em setembro de 2026). Em fevereiro de 2025 a marca anunciou a «morte» do Duo; no dia seguinte, os downloads no Android subiram 38% e as pesquisas 58% (Similarweb, citado pelo TechCrunch). Wendy’s: respostas humorísticas no X desde 2017; o National Roast Day existe desde 2018 e, em 2023, o #NationalRoastDay teve mais de 116 milhões de visualizações no TikTok (dado divulgado pela plataforma e reproduzido pela Mediashower; confirma antes de citar como número oficial). Terceiro cartão: dá 30 segundos para 2 ou 3 alunos dizerem uma marca que seguem porque “fala como um amigo”, e o que faz de diferente. Escreve as respostas no quadro: vais reutilizá-las nos meios ganhos e na persona. Pergunta extra: qual destas marcas já vos respondeu ou gozou convosco?',
 'tres-forcas':'Explica cada força em 1 minuto com um exemplo que eles vivem: uma série que não conseguem parar de ver (Stranger Things, Squid Game) = atenção, o “só mais um episódio”; um filme que os fez chorar = emoção; as letras e os memes que sabem de cor = memória. Cuidado: não cites estatísticas do tipo “as histórias são X vezes mais memoráveis” sem fonte, circulam muitas e raramente têm origem fiável.',
 'caso-wrapped':'Caso real. Spotify Wrapped 2025: 200 milhões de utilizadores participaram nas primeiras 24 horas (+19% face ao ano anterior) e cerca de 500 milhões de partilhas, incluindo partilhas na app, descargas e capturas de ecrã (Music Business Worldwide, 2025). Os dois cartões são ilustrativos, não são ecrãs reais. Revela os três ingredientes: a personagem és tu, o conflito é não saberes o que a tua música diz de ti, a transformação é descobrires a tua identidade e quereres mostrá-la. Pergunta: quem partilhou o seu Wrapped? Porquê? A marca não fala de si: dá-te uma história para contares.',
 'heroi-guia':'Ideia-chave de marketing: o cliente é o protagonista; a marca é o mentor (pensa em Yoda e Luke Skywalker, ou em Mando e Grogu). No Wrapped, o herói és tu e o Spotify é o guia. Pede à turma para pensar numa marca que conhecem bem e responder: no último conteúdo que viram, quem era o herói, o cliente ou a marca? Normalmente é a marca, e é por isso que esses conteúdos passam despercebidos.',
 'story-spine':'Aquecimento de 1 minuto: pede a alguém para contar o enredo de uma série ou filme que viu nas frases “Era uma vez… Todos os dias… Até que um dia…”. Explica as 8 frases com calma e revela-as por ordem. Insiste em 3 ideias: (1) as frases “Por causa disso” encadeiam causa e efeito, é isso que dá motor à história; (2) o clímax é o momento em que o conflito se resolve ou rebenta; (3) a última frase mostra a transformação, o novo normal. A estrutura é muitas vezes atribuída a Kenn Adams (improviso) e popularizada através da Pixar; se a usares em contexto avaliativo, confirma a origem.',
 'spine-exemplo':'Lê o exemplo em voz alta, frase a frase. Depois pede à turma: onde está a personagem? Qual é o conflito? Qual é a transformação? Repara que o produto só aparece no fim, como resultado, não como ponto de partida. A loja Segunda Mão é inventada para esta aula; o conflito (fast fashion a 5 euros) é um que eles conhecem bem. Pergunta: já trocaram ou venderam roupa online?',
 'ganchos':'Cinco tipos de gancho, cada um com um exemplo inventado. Lê-os em voz alta e pede à turma que diga qual os faria parar o scroll, e porquê. Liga com a Story Spine: o gancho é, na prática, a frase “Até que um dia…” trazida para o início. Desafio rápido (1 min): peça a cada aluno que escreva um gancho para um vídeo sobre a sua semana de aulas. No workshop, cada equipa terá de escrever o seu gancho.',
 'reels':'Em vídeo curto o gancho e a tensão quase se confundem: não há tempo para “contextualizar”. A coluna do telemóvel mostra a proporção aproximada de cada batida (a tensão ocupa a maior parte). Exemplo para a turma: “Perdi o voo por causa de uma meia” (gancho), o que aconteceu (tensão), a lição (recompensa), “envia isto a quem também se esquece de tudo” (convite). Exemplo inventado para a aula. Pergunta: quantos segundos esperam antes de fazer scroll?',
 'carrossel':'O carrossel é um “livro de bolso” da Story Spine. A capa é o gancho; os slides 2 e 3 são rutura e escalada; o 4 é o clímax e a resolução; o 5 é o convite. Pede à turma que dê exemplos de carrosséis que guardaram: quase sempre, o que os fez guardar foi uma viragem a meio. O carrossel também funciona no LinkedIn para histórias profissionais (um erro, uma lição, um método), útil para quando forem procurar estágio.',
 'etica':'Momento curto (2 min) mas importante. Quando uma história é inventada ou encenada, a audiência tem de poder saber. Com a IA generativa é mais fácil do que nunca produzir “testemunhos” e “cenas reais” falsas; recorda a turma de que a confiança é o ativo mais difícil de reconstruir. Lembra também que há regras de identificação de publicidade e de conteúdo patrocinado (#pub, parceria paga), e que devem verificar as aplicáveis antes de publicar, sobretudo se forem trabalhar como creators.',
 'fecho':'Encerramento. Agradece, abre 2 minutos para perguntas e termina com a frase do ecrã: cada grupo saiu com o início de uma campanha. Se combinaste um desafio pós-aula, anuncia-o agora.'
};
