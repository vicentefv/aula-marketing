<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aula · Ecrã</title>
<meta name="theme-color" content="#080C0A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body>
<div class="glow"></div>
<div class="stage">
 <div class="s-top"><div class="brand">Comunicação Digital e Marketing</div>
  <div class="join-pill"><span>Entra em</span><b id="purl" style="font-size:2.2vh;letter-spacing:0;color:var(--ink)"></b><span>código</span><b id="pcode"></b></div></div>
 <div class="s-body" id="body"></div>
 <div class="s-bar"><div class="nav" id="nav"></div>
  <button class="nv" id="newr">Nova sala</button>
  <button class="nv" id="rk">Ranking</button>
  <button class="btn ghost" id="sec" style="display:none"></button>
  <button class="btn" id="act">…</button></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="activities.js"></script>
<div class="land" id="lock" style="display:none">
 <div class="rise"><p class="sub" style="text-transform:uppercase;letter-spacing:.16em;font-weight:700;font-size:.8rem;color:var(--coral)">Área do professor</p>
 <h1 style="margin-top:10px">Código de <em>acesso</em></h1></div>
 <form class="codein rise" style="animation-delay:.1s" id="lf"><input id="lp" type="password" inputmode="numeric" maxlength="12" placeholder="••••••" autocomplete="off"><button class="btn" type="submit">Entrar</button></form>
 <div class="err" id="le"></div>
</div>
<script>
/* avisa a apresentação (quando está dentro dela) que a página carregou */
try{if(window.parent!==window)parent.postMessage({aula:1,t:'loaded'},'*')}catch(e){}
(()=>{const H="dc96f99a712bf005067bf0985b36f2b1ef789f60060257bf0c8ec4c229637f20",K='aula-prof-ok';
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const st=document.querySelector('.stage'),lk=document.getElementById('lock');st.style.display='none';
let loaded=false;const go=()=>{if(loaded)return;loaded=true;lk.style.display='none';st.style.display='';const s=document.createElement('script');s.src='host.js';document.body.appendChild(s)};
const ok=()=>{try{return localStorage.getItem(K)===H}catch(e){return false}};
if(ok())go();else{lk.style.display='';
 let fails=0;document.getElementById('lf').onsubmit=async e=>{e.preventDefault();const er=document.getElementById('le'),v=document.getElementById('lp').value.trim();
  if(await sha('aula-prof:'+v)===H){try{localStorage.setItem(K,H)}catch(x){}go()}
  else{fails++;er.textContent='Código errado.';document.getElementById('lp').value='';const b=document.querySelector('#lf button');b.disabled=true;setTimeout(()=>{b.disabled=false},Math.min(fails*1500,8000))}}}
})();
</script>
</body></html>
